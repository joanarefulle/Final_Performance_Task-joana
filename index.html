
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <header class="form-header">
            <div class="logo" aria-hidden="true">SR</div>
            <h1>Student Registration</h1>
            <p>Complete the form below to register as a student.</p>
        </header>

        <form id="registrationForm" novalidate>
            <p class="required-note">Fields marked with * are required.</p>

            <section>
                <h2>Personal Information</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="studentId">Student ID *</label>
                        <input type="text" id="studentId"
                            name="studentId" placeholder="e.g. 2026-0001"
                            data-error="studentIdError"
                            data-required="true">
                        <small class="error-message" id="studentIdError"></small>
                    </div>

                    <div class="form-group">
                        <label for="fullName">Full Name *</label>
                        <input type="text" id="fullName"
                            name="fullName" placeholder="Enter your full name"
                            autocomplete="name"
                            data-error="fullNameError"
                            data-required="true">
                        <small class="error-message" id="fullNameError"></small>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <input type="text" id="email" name="email"
                            placeholder="student@example.com"
                            autocomplete="email"
                            data-error="emailError"
                            data-required="true">
                        <small class="error-message" id="emailError"></small>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number *</label>
                        <input type="tel" id="phone" name="phone"
                            placeholder="09XXXXXXXXX"
                            autocomplete="tel"
                            data-error="phoneError"
                            data-required="true">
                        <small class="error-message" id="phoneError"></small>
                    </div>

                    <div class="form-group">
                        <label for="dob">Date of Birth *</label>
                        <input type="date" id="dob" name="dob"
                            data-error="dobError"
                            data-required="true">
                        <small class="error-message" id="dobError"></small>
                    </div>

                    <div class="form-group">
                        <label for="gender">Gender *</label>
                        <select id="gender" name="gender"
                            data-error="genderError">
                            <option value="">Select gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Prefer not to say">Prefer not to say</option>
                        </select>
                        <small class="error-message" id="genderError"></small>
                    </div>
                </div>
            </section>

            <section>
                <h2>Academic Information</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="program">Program *</label>
                        <select id="program" name="program"
                            data-error="programError">
                            <option value="">Select your program</option>
                            <option value="BSIT">BS Information Technology</option>
                            <option value="BSCS">BS Computer Science</option>
                            <option value="BSIS">BS Information Systems</option>
                            <option value="BSED">Bachelor of Secondary Education</option>
                            <option value="BSBA">BS Business Administration</option>
                        </select>
                        <small class="error-message" id="programError"></small>
                    </div>

                    <div class="form-group">
                        <label for="yearLevel">Year Level *</label>
                        <select id="yearLevel" name="yearLevel"
                            data-error="yearLevelError">
                            <option value="">Select year level</option>
                            <option value="1st Year">1st Year</option>
                            <option value="2nd Year">2nd Year</option>
                            <option value="3rd Year">3rd Year</option>
                            <option value="4th Year">4th Year</option>
                            <option value="5th Year">5th Year</option>
                        </select>
                        <small class="error-message" id="yearLevelError"></small>
                    </div>
                </div>
            </section>

            <section>
                <h2>Account Security</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="password">Password *</label>
                        <input type="password" id="password"
                            name="password" placeholder="At least 8 characters"
                            autocomplete="new-password"
                            data-error="passwordError"
                            data-min-length="8">
                        <small class="error-message" id="passwordError"></small>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password *</label>
                        <input type="password" id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Re-enter your password"
                            autocomplete="new-password"
                            data-error="confirmPasswordError">
                        <small class="error-message" id="confirmPasswordError"></small>
                    </div>
                </div>

                <button type="button" id="togglePassword"
                    class="toggle-password"
                    aria-pressed="false">
                    Show Passwords
                </button>
            </section>

            <section>
                <h2>Contact Information</h2>
                <div class="form-group">
                    <label for="address">Complete Address *</label>
                    <textarea id="address" name="address" rows="3"
                        placeholder="House number, street, barangay, city..."
                        autocomplete="street-address"
                        data-error="addressError"></textarea>
                    <small class="error-message" id="addressError"></small>
                </div>
            </section>

            <div class="agreement-group">
                <input type="checkbox" id="agreement" name="agreement">
                <label for="agreement">
                    I confirm that the information I provided is accurate
                    and agree to the registration requirements. *
                </label>
            </div>
            <small class="error-message" id="agreementError"></small>

            <div id="successMessage" class="success-message"
                role="status" aria-live="polite" hidden></div>

            <div class="button-group">
                <button type="submit" class="submit-btn">
                    Submit Registration
                </button>
                <button type="reset" class="reset-btn">
                    Reset Form
                </button>
            </div>

            <p class="footer-note">Please check your information before submitting.</p>
        </form>
    </main>
</body>
</html>
